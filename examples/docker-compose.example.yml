services:
  plex-tg-bot:
    image: ghcr.io/andrewgolikov55/plex-tg-bot:latest
    container_name: plex-tg-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "9095:9095"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9095/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
