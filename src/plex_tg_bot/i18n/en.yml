welcome:
  no_access: "Hi! I'm the access bot for Plex server «{server_name}». Press the button below to request access."
  has_access: "Hi! You already have access to «{server_name}». What would you like to do?"
  pending: "⏳ Your request is awaiting admin approval."
request:
  ask_email: "Send your email — Plex will deliver the invite there."
  invalid_email: "That doesn't look like a valid email. Please try again."
  ask_referrer: "Where did you hear about the bot / who sent you? Free text."
  submitted: "⏳ Request submitted. I'll message you once an admin decides."
  already_have_access: "You already have access."
  already_pending: "Your previous request is still pending."
  access_required: "Please request access first via /request."
admin:
  request_card: |-
    📥 Access request
    From: {user} (TG: {tg_id})
    Email: {email}
    Referrer: {referrer}
  approved_by: "✅ Approved by {admin} at {time}"
  rejected_by: "❌ Rejected by {admin} at {time}"
  ask_reject_reason: "@{admin}, please reply to this message with the rejection reason, or send /skip."
  already_handled: "Already handled by @{admin}"
  not_authorized: "Not authorized."
  sync_done: "Daily sync finished. Active: {active}, revoked: {revoked}."
  panel_title: "🛠 Admin panel"
  users_button: "👥 Users"
  pending_button: "⏳ Pending"
  sync_button: "🔄 Sync now"
  back_button: "⬅ Back"
  users_header: "👥 Users (page {page}/{total_pages}, total {total})"
  users_empty: "No users yet."
  pending_header_paginated: "⏳ Pending (page {page}/{total_pages}, total {total})"
  pending_empty: "No pending requests."
  remove_confirm: |-
    Remove {email} from Plex?

    This revokes their access on Plex and deletes them from the bot DB.
  remove_yes: "✅ Yes, remove"
  remove_cancel: "❌ Cancel"
  remove_success: "✅ {email} removed."
  remove_plex_unreachable: "❌ Plex unreachable, try again later. The user has NOT been removed."
  remove_plex_auth_error: "❌ Plex token rejected (401). Check PLEX_TOKEN. The user has NOT been removed."
  remove_not_found: "User not found in DB."
  retry_button: "🔄 Retry"
notify_user:
  approved: |-
    ✅ Done!

    1. Tap "Accept invite" below — Plex will ask you to sign in (Google / Apple / email — any).
    2. After login the server «{server_name}» appears in your library list automatically.
    3. ⚠️ Plex's setup screen pushes its own libraries (Watchlist, Live TV, Movies & Shows). Those aren't from this server — uncheck them and keep only the ones the admin shared.

    Don't see the link? An email with the same invite is on its way to {email}.
  approved_no_token: |-
    ✅ Done!

    An invite email is on its way to {email} — tap the link in that email to accept.

    If you already have a Plex account with this email, you can just open app.plex.tv and log in — the server «{server_name}» will appear in your library list.

    ⚠️ Plex's setup screen pushes its own libraries (Watchlist, Live TV, Movies & Shows). Those aren't from this server — uncheck them and keep only the ones the admin shared.
  rejected: "❌ Your request was rejected.\nReason: {reason}"
  rejected_no_reason: "❌ Your request was rejected."
  revoked: "❌ Your access to Plex has been revoked by the admin."
  accept_invite_button: "🌐 Accept invite"
  apps_button: "📱 Get apps"
menu:
  request_access: "📥 Request access to Plex"
  apps: "📱 Get apps"
  watch: "🌐 Watch in browser"
  overseerr: "🎬 Request content"
help:
  text: "Commands: /start, /request, /apps, /watch, /overseerr, /help"
bot_meta:
  short_description: "Self-serve Plex access. Send /request and a friend's email — admin approves in one tap."
  description: |-
    Self-hostable Telegram bot for managing Plex server access.

    Send /request — type your email, mention who sent you, and the admin gets an inline-button approval card. After approve you receive a Plex invite, plus shortcuts to apps, web player, and Overseerr.
commands:
  start: "Open the main menu"
  request: "Request access to the Plex server"
  admin: "Admin panel (admins only)"
errors:
  plex_unreachable: "Plex API is unreachable right now. Please try later."
  plex_temporary: "Plex unreachable, try again later"
  internal: "Internal error. Admin has been notified."
  feature_disabled: "This feature is not configured by the admin."
