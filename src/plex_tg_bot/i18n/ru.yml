help:
  text: "Команды: /start, /request, /apps, /watch, /overseerr, /help"
bot_meta:
  short_description: "Самостоятельный доступ к Plex. Отправь /request и email — админ одобрит в один тап."
  description: |-
    Self-hosted Telegram-бот для управления доступом к Plex.

    Отправь /request — введи email, напиши откуда узнал о боте, и админу прилетит карточка с inline-кнопками. После одобрения тебе придёт инвайт от Plex, плюс кнопки на приложения, веб-плеер и Overseerr.

    Open source: https://github.com/AndrewGolikov55/plex-tg-bot
