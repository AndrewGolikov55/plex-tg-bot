name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv venv
      - run: uv pip install -e ".[dev]"
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -v
      - name: docker compose config (production manifest)
        run: |
          cp .env.example .env
          # fill in REQUIRED placeholders for syntactic validation only
          sed -i 's|REPLACE-WITH-YOUR-BOT-TOKEN|fake|; s|REPLACE-WITH-YOUR-PLEX-TOKEN|fake|' .env
          docker compose -f docker-compose.yml --env-file .env config -q
      - name: docker compose config (dev manifest)
        run: |
          docker compose -f docker-compose.dev.yml --env-file .env config -q
