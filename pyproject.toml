[project]
name = "plex-tg-bot"
version = "0.1.2"
description = "Self-hostable Telegram bot for managing Plex server access"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Andrey Golikov" }]
dependencies = [
    "aiogram>=3.7,<4",
    "aiohttp-socks>=0.10",
    "httpx[socks]>=0.27",
    "aiosqlite>=0.20",
    "apscheduler>=3.10",
    "prometheus-client>=0.20",
    "pydantic-settings>=2.3",
    "email-validator>=2.2",
    "pyyaml>=6.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "freezegun>=1.5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
plex-tg-bot = "plex_tg_bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plex_tg_bot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["plex_tg_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
